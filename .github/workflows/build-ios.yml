name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install

      - name:
        run: |
          cd ios
          xcodebuild -workspace churrascometro.xcworkspace -scheme churrascometro -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Empacotar
        run: |
          mkdir -p Aplicacao
          mv ios/build/Build/Products/Release-iphoneos/churrascometro.app Aplicacao/
          zip -r app.ipa Aplicacao

      - name: Upload
        uses: actions/upload-artifact@4
        with:
          name: app
          path: app.ipa
          
        
